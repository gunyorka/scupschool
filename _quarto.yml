project:
  type: website
  output-dir: _site

  resources:
    - assets/booklets/**/*.pdf
    - assets/vendor/**
    - assets/js/**

  render:
    - "*.qmd"
    - "course/**/*.qmd"
    - "modules/**/*.qmd"
    - "support/**/*.qmd"
    - "!dev/**"

lang: hu

website:
  title: "SCUP School"
  site-url: https://scupschool.hu
  description: "Projektfejlesztő kurzus a Szent-Györgyi Tanulmányi Verseny SCUP School tudománykommunikációs projektversenyéhez."
  page-navigation: false

  open-graph: true
  twitter-card: true

  navbar:
    pinned: true

    left:
      - href: index.qmd
        text: Mérföldkőtérkép

      - href: modules/01-temavalasztas-es-csapatinditas/02-melyik-temaval-foglalkoznal-szivesen.qmd#bookletek
        text: Bookletek

      - text: Kurzusinformációk
        menu:
          - href: course/how-course-works.qmd
            text: Hogyan működik a kurzus?

          - href: course/deadlines.qmd
            text: Határidők és beadás

          - href: course/palyazati-felulet.qmd
            text: A pályázati felület használata

          - href: course/faq.qmd
            text: Gyakori kérdések

      - href: support/index.qmd
        text: Segítségtár

  search:
    location: navbar
    type: overlay

  page-footer:
    center: "SCUP School — Együtt a Tudományért Egyesület"

format:
  html:
    theme:
      - cosmo
      - brand
      - assets/styles/scupschool.scss

    toc: true
    toc-title: "Ezen az oldalon"
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto
