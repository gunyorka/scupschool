project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "course/**/*.qmd"
    - "modules/**/*.qmd"
    - "support/**/*.qmd"

lang: hu

website:
  title: "Scup School"
  page-navigation: false

  navbar:
    pinned: true

    left:
      - href: index.qmd
        text: Mérföldkőtérkép

      - text: Kurzusinformációk
        menu:
          - href: course/how-course-works.qmd
            text: Hogyan működik a kurzus?

          - href: course/deadlines.qmd
            text: Határidők és beadás

          - href: course/faq.qmd
            text: Gyakori kérdések

      - href: support/index.qmd
        text: Segítségtár

    tools:
      - icon: github
        href: https://github.com/gunyorka/scupschool
        aria-label: Scup School GitHub repository
        
  sidebar:
    - id: support-csapatdinamika
      title: "A kisokos további oldalai"
      style: floating
      search: false
      contents:
        - support/csapatdinamika-kisokos/04-keszitsetek-csapatmegallapodast.qmd
        - support/csapatdinamika-kisokos/05-hogyan-epitsetek-egymas-otleteire.qmd
        - support/csapatdinamika-kisokos/01-hogyan-biztositsatok-hogy-mindenki-szohoz-jusson.qmd
        - support/csapatdinamika-kisokos/02-mit-tegyetek-ha-nem-tudtok-megegyezni.qmd
        - support/csapatdinamika-kisokos/03-mit-tegyetek-ha-valaki-nem-vegzi-el-a-feladatat.qmd
        - support/csapatdinamika-kisokos/06-hogyan-tartsatok-hatekony-online-meetinget.qmd

  search:
    location: navbar
    type: overlay

  page-footer:
    center: "Scup School — Együtt a Tudományért Egyesület"

format:
  html:
    theme:
      - cosmo
      - brand
      - assets/styles/scupschool.scss

    toc: true
    toc-title: "Ezen az oldalon"
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto