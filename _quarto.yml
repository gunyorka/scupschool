project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "course/**/*.qmd"
    - "modules/**/*.qmd"
    - "support/**/*.qmd"

lang: hu

website:
  title: "ScupSchool"
  page-navigation: true

  navbar:
    pinned: true

    left:
      - href: index.qmd
        text: Mérföldkőtérkép

      - text: Kurzusinformációk
        menu:
          - href: course/how-course-works.qmd
            text: Hogyan működik a kurzus?

          - href: course/deadlines.qmd
            text: Határidők és beadás

          - href: course/faq.qmd
            text: Gyakori kérdések

      - href: support/index.qmd
        text: Segítségtár

    tools:
      - icon: github
        href: https://github.com/gunyorka/scupschool
        aria-label: ScupSchool GitHub repository

  search:
    location: navbar
    type: overlay

  page-footer:
    center: "ScupSchool — Együtt a Tudományért Egyesület"

format:
  html:
    theme:
      - cosmo
      - brand
      - assets/styles/scupschool.scss

    toc: true
    toc-title: "Ezen az oldalon"
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto