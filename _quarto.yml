project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "course/**/*.qmd"
    - "modules/**/*.qmd"
    - "support/**/*.qmd"

lang: hu

website:
  title: "ScupSchool"
  page-navigation: true

  navbar:
    pinned: true

    left:
      - href: index.qmd
        text: Mérföldkőtérkép

      - text: Kurzusinformációk
        menu:
          - href: course/how-course-works.qmd
            text: Hogyan működik a kurzus?

          - href: course/deadlines.qmd
            text: Határidők és beadás

          - href: course/faq.qmd
            text: Gyakori kérdések

      - href: support/index.qmd
        text: Segítségtár

    tools:
      - icon: github
        href: https://github.com/gunyorka/scupschool
        aria-label: ScupSchool GitHub repository

  sidebar:
    - id: problem-identification
      title: "2. ciklus — Problémaazonosítás"
      style: docked
      collapse-level: 2

      contents:
        - href: modules/02-brainstorming/02-problem-identification/index.qmd
          text: Áttekintés

        - section: "Felkészülés a 2. meetingre"
          contents:
            - href: modules/02-brainstorming/02-problem-identification/01-process-booklet.qmd
              text: Hogyan dolgozd fel a bookletet?

            - href: modules/02-brainstorming/02-problem-identification/02-define-problem.qmd
              text: Mit értünk probléma alatt?

            - href: modules/02-brainstorming/02-problem-identification/03-choose-problems.qmd
              text: Fogalmazz meg három problémát

            - href: modules/02-brainstorming/02-problem-identification/04-meeting-readiness.qmd
              text: Készen állsz a meetingre

        - section: "Személyes meeting"
          contents:
            - href: modules/02-brainstorming/02-problem-identification/05-meeting.qmd
              text: 2. meeting — Problémaazonosítás

  search:
    location: navbar
    type: overlay

  page-footer:
    center: "ScupSchool — Együtt a Tudományért Egyesület"

format:
  html:
    theme:
      - cosmo
      - brand
      - assets/styles/scupschool.scss

    include-after-body: _includes/_cycle-route-script.html

    toc: true
    toc-title: "Ezen az oldalon"
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto