name: Publish site

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore booklet web copies
        uses: actions/cache@v4
        with:
          path: assets/booklets/web
          key: booklets-${{ hashFiles('assets/booklets/*.pdf', 'scripts/optimize-booklets.sh') }}

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y ghostscript qpdf

      - name: Build booklet web copies
        run: ./scripts/optimize-booklets.sh

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
